name: "CI · Jsdoc"

on:
  workflow_call:

# Serialise gh-pages writes so doc deploys cannot race. Scoped to this
# reusable workflow (the only gh-pages writer) so the rest of CI is not
# serialised with it.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  jsdoc:
    runs-on: ubuntu-latest
    name: Generate documentation and push to Github pages.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - name: Install dependencies
        run: npm ci
      - name: Build bundle
        run: npm run build
      - name: Build documentation
        run: npm run docs
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          publish_dir: ./docs
          commit_message: ":memo: Update docs ${{ github.event.head_commit.message }}"
